; ESP8266 (NodeMCU): transparent Wi-Fi ↔ UART bridge
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_speed = 921600
lib_deps =
    tzapu/WiFiManager@^2.0.17
build_flags =
    -Wall
    ; MSS 1460 and larger TCP buffers: the small-packet queue fills up later
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
