; STM32F103C8 (Blue Pill): display, touch, UART protocol
[platformio]
default_envs = bluepill

[env]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
; The default GCC 7.2 package is x86_64-only; pin GCC 12.3, which has native arm64 (Apple Silicon) builds
platform_packages = toolchain-gccarmnoneeabi@~1.120301.0
build_flags =
    -Os
    -Wall
    -Wextra
    -Iinclude
; Flash budget is the official 64 KB (F_SIZE), even though many C8 parts accept writes above it.

; Main application: protocol, UI, touch
[env:bluepill]
build_src_filter = +<*> -<harness_main.c> -<touch_diag.c>

; Bring-up harness for display and touch: tools/lcd_ctl.py, tools/touch_ctl.py, tools/touch_diag.py
[env:harness]
build_src_filter = +<*> -<app_main.c> -<link.c> -<blit.c> -<ui.c> -<crc16.c>
